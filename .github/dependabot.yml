version: 2
updates:
  - package-ecosystem: "npm" # Dependabot usa "npm" para ler pnpm-lock.yaml automaticamente
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday" # Roda toda segunda-feira para manter a segurança em dia
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "security"
    # Agrupa todas as atualizações não-críticas em um único PR para evitar spam no repositório
    groups:
      all-deps:
        patterns:
          - "*"
