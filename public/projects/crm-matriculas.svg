<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-label="Funil de intenções de matrícula">
  <!-- Imagem provisória (ilustração abstrata de um funil de CRM). Substituir por uma captura de tela sem dados sensíveis. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020607"/>
      <stop offset="1" stop-color="#0a1d1f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.3" r="0.6">
      <stop offset="0" stop-color="#85E8EA" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#85E8EA" stop-opacity="0"/>
    </radialGradient>
    <g id="card">
      <rect width="270" height="90" rx="14" fill="#85E8EA" fill-opacity="0.05" stroke="#85E8EA" stroke-opacity="0.35" stroke-width="2"/>
      <rect x="24" y="26" width="150" height="10" rx="5" fill="#85E8EA" fill-opacity="0.55"/>
      <rect x="24" y="52" width="92" height="10" rx="5" fill="#85E8EA" fill-opacity="0.25"/>
    </g>
    <g id="card-done">
      <rect width="270" height="90" rx="14" fill="#85E8EA" fill-opacity="0.22" stroke="#85E8EA" stroke-opacity="0.9" stroke-width="2"/>
      <rect x="24" y="26" width="150" height="10" rx="5" fill="#85E8EA" fill-opacity="0.95"/>
      <rect x="24" y="52" width="92" height="10" rx="5" fill="#85E8EA" fill-opacity="0.55"/>
    </g>
    <g id="head">
      <rect width="120" height="12" rx="6" fill="#85E8EA" fill-opacity="0.7"/>
      <rect x="0" y="30" width="270" height="2" fill="#85E8EA" fill-opacity="0.25"/>
    </g>
  </defs>

  <rect width="1600" height="1000" fill="url(#bg)"/>
  <rect width="1600" height="1000" fill="url(#glow)"/>

  <!-- Quatro etapas do funil: cada coluna tem menos cards que a anterior -->
  <use href="#head" x="200" y="190"/>
  <use href="#card" x="200" y="250"/>
  <use href="#card" x="200" y="360"/>
  <use href="#card" x="200" y="470"/>
  <use href="#card" x="200" y="580"/>
  <use href="#card" x="200" y="690"/>

  <use href="#head" x="510" y="190"/>
  <use href="#card" x="510" y="250"/>
  <use href="#card" x="510" y="360"/>
  <use href="#card" x="510" y="470"/>
  <use href="#card" x="510" y="580"/>

  <use href="#head" x="820" y="190"/>
  <use href="#card" x="820" y="250"/>
  <use href="#card" x="820" y="360"/>
  <use href="#card" x="820" y="470"/>

  <use href="#head" x="1130" y="190"/>
  <use href="#card-done" x="1130" y="250"/>
  <use href="#card-done" x="1130" y="360"/>
</svg>
